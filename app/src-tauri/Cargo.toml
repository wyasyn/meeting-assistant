[package]
name = "meeting-assistant"
version = "0.1.0"
description = "Meeting Assistant desktop app"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meeting_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4"
getrandom = "0.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
# AGENTS.md: no unwrap()/expect() outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
