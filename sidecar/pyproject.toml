[project]
name = "meeting-assistant-sidecar"
version = "0.1.0"
description = "Local ML sidecar (speech-to-text, diarization, embeddings) for Meeting Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real ML models"]
